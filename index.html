<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#101426" /><title>ひらめきジェネレーター</title><link rel="stylesheet" href="style.css" /><script src="script.js" defer></script></head>
<body><main class="app-shell"><header><p class="eyebrow"><span></span> TINY IDEA MACHINE</p><h1>今日の、<em>ひらめき。</em></h1><p class="intro">ボタンを押すたび、ちょっと試したくなる小さなアイデアを届けます。</p></header>
<section class="idea-card" aria-live="polite"><div class="card-topline"><span id="category">暮らし</span><span id="ideaNumber">01 / 12</span></div><p class="spark">✦</p><h2 id="ideaTitle">いつもの散歩道で、<br>「青いもの」だけを探す。</h2><p id="ideaDescription">視点をひとつ決めるだけで、見慣れた景色が少しだけ新しくなります。</p><div class="card-footer"><button id="saveButton" class="save-button" type="button" aria-pressed="false">♡ お気に入りに保存</button><span id="mood">所要時間：15分</span></div></section>
<div class="actions"><button id="nextButton" class="next-button" type="button">次のひらめきを引く <span>→</span></button><button id="surpriseButton" class="text-button" type="button">ランダムにする</button></div><aside class="saved-panel"><div><p>YOUR COLLECTION</p><strong><span id="savedCount">0</span> 個のお気に入り</strong></div><div id="savedDots" class="saved-dots" aria-label="保存済みアイデア"></div></aside></main></body></html>
